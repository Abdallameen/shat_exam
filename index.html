<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاختبار النصفي – شرح أصول متن الشاطبية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--g:#0f5132;--g2:#198754;--gold:#c9a227;--bg:#f6f3ea;--red:#b02a37}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:#222}
  header{background:linear-gradient(135deg,var(--g),#0b3d26);color:#fff;text-align:center;padding:28px 16px;border-bottom:5px solid var(--gold)}
  header h1{font-family:'Amiri',serif;margin:0;font-size:2rem}
  header p{margin:6px 0 0;opacity:.85}
  .wrap{max-width:820px;margin:24px auto;padding:0 14px}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001;padding:24px;margin-bottom:16px}
  input[type=text]{width:100%;padding:14px;font:inherit;font-size:1.1rem;border:2px solid #ddd;border-radius:10px}
  input[type=text]:focus{outline:none;border-color:var(--g2)}
  .btn{background:var(--g2);color:#fff;border:0;border-radius:10px;padding:14px 28px;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;width:100%;margin-top:14px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  ul.rules{line-height:2}
  .bar{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 2px 10px #0002;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .timer{font-weight:800;font-size:1.3rem;color:var(--g);direction:ltr}
  .timer.warn{color:var(--red);animation:p 1s infinite}@keyframes p{50%{opacity:.4}}
  .prog{flex:1;height:8px;background:#eee;border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);width:0;transition:.3s}
  .q{display:flex;gap:14px;align-items:flex-start}
  .num{background:var(--g);color:#fff;min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800}
  .txt{font-family:'Amiri',serif;font-size:1.35rem;line-height:1.8;flex:1}
  .opts{display:flex;gap:10px;margin-top:12px}
  .opts label{flex:1;border:2px solid #ddd;border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-weight:700;transition:.2s}
  .opts input{display:none}
  .opts input:checked+span.t{color:#fff}
  .opts label:has(input[value=true]:checked){background:var(--g2);border-color:var(--g2);color:#fff}
  .opts label:has(input[value=false]:checked){background:var(--red);border-color:var(--red);color:#fff}
  .hidden{display:none}
  .score{text-align:center}.score .big{font-size:4rem;font-weight:800;color:var(--g)}
  table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:center}
  .ok{color:var(--g2);font-weight:800}.no{color:var(--red);font-weight:800}
  .msg{text-align:center;padding:30px;font-size:1.2rem}
</style>
</head>
<body>
<header><h1>الاختبار النصفي</h1><p>دورة شرح أصول متن الشاطبية</p></header>

<!-- شاشة البداية -->
<div class="wrap" id="start">
  <div class="card">
    <h2>تعليمات الاختبار</h2>
    <ul class="rules">
      <li>عدد الأسئلة: <b>30</b> سؤالًا (صح أو خطأ) – لكل سؤال درجة واحدة.</li>
      <li>مدة الاختبار: <b>45 دقيقة</b>، ويُسلَّم تلقائيًا عند انتهاء الوقت.</li>
      <li>يُسمح بمحاولة واحدة فقط.</li>
    </ul>
    <label><b>الاسم الثلاثي:</b></label>
    <input type="text" id="name" placeholder="اكتب اسمك هنا">
    <button class="btn" id="go">ابدأ الاختبار</button>
  </div>
</div>

<!-- شاشة الأسئلة -->
<div id="exam" class="hidden">
  <div class="bar"><span id="who"></span><div class="prog"><i id="pg"></i></div><span class="timer" id="timer">45:00</span></div>
  <div class="wrap"><div id="qs"></div>
    <button class="btn" id="submit">تسليم الاختبار</button></div>
</div>

<!-- شاشة النتيجة -->
<div class="wrap hidden" id="result"></div>

<script>
// ⚠️ ضع هنا رابط الـ Web App بعد نشر Code.gs
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4zn3ti2KTDBAUhl-Yv8ws_atLvNWxoeW5pVXERnJMKymOG17hABKACoTggprQOnw0fQ/exec";
const DURATION = 45 * 60;

const Q = [
"شروط القراءة الصحيحة: تواتر السند، وموافقة العربية، وموافقة رسم المصحف.",
"الراوي الأول لحمزة الكسائي.",
"«رست» رمز لابن عامر وراوييه.",
"يذكر الإمام الشاطبي الرموز الحرفية بعد اللفظ القرآني.",
"«سما» رمز لابن عامر والكوفيين.",
"الجزم ضده الرفع ولا ينعكس.",
"مطلق التحريك هو الفتح وضده السكون.",
"الاستعاذة جهرًا في كل أحوال التلاوة.",
"مذهب حمزة بين السورتين هو السكت.",
"قرأ حمزة في قوله تعالى ﴿بِهِمُ الْأَسْبَابُ﴾ بضم الهاء وصلًا ووقفًا.",
"قرأ السوسي بإدغام المثلين الكبير من كلمة مطلقًا.",
"للسوسي عن أبي عمرو في قوله تعالى ﴿يَخْلُ لَكُمْ﴾ وجهان: الإظهار والإدغام.",
"في كلمة ﴿نَرْزُقُكَ﴾ للسوسي إدغام القاف في الكاف.",
"من موانع الإدغام الكبير للسوسي في المتماثلين والمتقاربين تنوين الحرف المدغم.",
"الإدغام من موانع الإمالة في كلمة «النار» مكسورة الراء في نحو ﴿النَّارِ رَبَّنَا﴾.",
"من أصول ابن كثير صلة هاء الكناية الواقعة بين ساكن ومتحرك.",
"قرأ أبو عمرو البصري بتسكين هاء الكناية في ﴿نُوَلِّهِ﴾ و﴿نُصْلِهِ﴾.",
"قرأ عاصم بإسكان هاء الكناية في كلمة ﴿فَأَلْقِهْ﴾ في سورة النمل.",
"قرأ قالون وهشام بإسكان هاء الكناية في كلمة ﴿يَأْتِهِ﴾ في سورة طه.",
"في كلمة ﴿أَرْجِهْ﴾ سبع قراءات.",
"مذهب أهل «سما» تحقيق الهمزتين المختلفتين من كلمتين.",
"قرأ حمزة بالتوسط في المدين المنفصل والمتصل.",
"لورش القصر والتوسط والإشباع في البدل وشبيه البدل مطلقًا.",
"قاعدة عاصم في الاستفهام المكرر الإخبار فيهما.",
"لحمزة في كلمة ﴿جَزَاءً﴾ في قوله تعالى ﴿جَزَاءً الْحُسْنَى﴾ في سورة الكهف اثنا عشر وجهًا.",
"قرأ نافع بالنقل في كلمة ﴿رِدْءًا﴾ في سورة القصص.",
"كلمة ﴿قُرُوءٍ﴾ لحمزة وهشام وقفًا فيها وجهان.",
"مذهب نافع براوييه في نحو كلمة ﴿أَأَنْذَرْتَهُمْ﴾ تسهيل الثانية بدون إدخال.",
"في قوله تعالى ﴿هَا أَنْتُمْ هَؤُلَاءِ﴾ لقالون تحريرًا سبعة أوجه.",
"كلمة ﴿سَوْآتِكُمْ﴾ في سورة الأعراف تحريرًا لورش فيها أربعة أوجه."
];

const $ = id => document.getElementById(id);
let name, startTime, tick, sent = false;

if (localStorage.getItem('shatibiya_done')) showResult(JSON.parse(localStorage.getItem('shatibiya_done')));

$('qs').innerHTML = Q.map((t, i) => `
  <div class="card"><div class="q"><div class="num">${i+1}</div><div class="txt">${t}</div></div>
  <div class="opts">
    <label><input type="radio" name="q${i}" value="true"> ✔ صح</label>
    <label><input type="radio" name="q${i}" value="false"> ✘ خطأ</label>
  </div></div>`).join('');

$('qs').addEventListener('change', () => {
  const n = document.querySelectorAll('#qs input:checked').length;
  $('pg').style.width = (n / Q.length * 100) + '%';
});

$('go').onclick = () => {
  name = $('name').value.trim();
  if (name.split(/\s+/).length < 2) return alert('من فضلك اكتب اسمك كاملًا');
  $('start').classList.add('hidden'); $('exam').classList.remove('hidden');
  $('who').textContent = name;
  startTime = Date.now();
  tick = setInterval(updateTimer, 1000); updateTimer();
  window.onbeforeunload = () => 'سيضيع الاختبار إن خرجت';
};

function updateTimer() {
  const left = DURATION - Math.floor((Date.now() - startTime) / 1000);
  if (left <= 0) { submit(true); return; }
  const m = String(Math.floor(left / 60)).padStart(2, '0'), s = String(left % 60).padStart(2, '0');
  $('timer').textContent = m + ':' + s;
  $('timer').classList.toggle('warn', left <= 300);
}

$('submit').onclick = () => {
  const n = document.querySelectorAll('#qs input:checked').length;
  if (n < Q.length && !confirm(`لم تُجب على ${Q.length - n} سؤال. هل تريد التسليم؟`)) return;
  submit(false);
};

async function submit(timeout) {
  if (sent) return; sent = true;
  clearInterval(tick); window.onbeforeunload = null;
  const answers = Q.map((_, i) => {
    const c = document.querySelector(`input[name=q${i}]:checked`);
    return c ? c.value === 'true' : null;
  });
  $('exam').classList.add('hidden'); $('result').classList.remove('hidden');
  $('result').innerHTML = '<div class="card msg">⏳ جارٍ تصحيح الاختبار...</div>';
  try {
    const r = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ name, answers, timeout, minutes: ((Date.now() - startTime) / 60000).toFixed(1) }) });
    const data = await r.json();
    const out = { name, score: data.score, results: data.results, answers };
    localStorage.setItem('shatibiya_done', JSON.stringify(out));
    showResult(out);
  } catch (e) {
    $('result').innerHTML = '<div class="card msg">⚠️ تعذّر إرسال الإجابات. تأكد من الاتصال بالإنترنت ثم أعد المحاولة.<br><button class="btn" id="retry">إعادة الإرسال</button></div>';
    $('retry').onclick = () => { sent = false; $('exam').classList.remove('hidden'); $('result').classList.add('hidden'); submit(timeout); };
  }
}

function showResult(d) {
  $('start').classList.add('hidden'); $('exam').classList.add('hidden'); $('result').classList.remove('hidden');
  const pct = Math.round(d.score / 30 * 100);
  $('result').innerHTML = `
    <div class="card score"><h2>${d.name}</h2><div class="big">${d.score} / 30</div><p>النسبة: ${pct}%</p></div>
    <div class="card"><table><tr><th>السؤال</th><th>إجابتك</th><th>النتيجة</th></tr>
    ${d.results.map((ok, i) => `<tr><td>${i+1}</td>
      <td>${d.answers[i] === null ? '—' : d.answers[i] ? 'صح' : 'خطأ'}</td>
      <td class="${ok ? 'ok' : 'no'}">${ok ? '✔ صحيحة' : '✘ خاطئة'}</td></tr>`).join('')}
    </table></div>`;
}
</script>
</body>
</html>
